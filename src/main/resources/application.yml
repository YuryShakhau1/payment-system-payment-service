spring:
  data:
    mongodb:
      host: localhost
      port: ${PAYMENT_SERVICE_MONGO_DB_PORT}
      database: ${PAYMENT_SERVICE_MONGO_DB_NAME}
      username: ${PAYMENT_SERVICE_MONGO_DB_USERNAME}
      password: ${PAYMENT_SERVICE_MONGO_DB_PASSWORD}
      authentication-database: admin

  liquibase:
    change-log: db/changelog/db.changelog-master.yml
    url: mongodb://localhost:${PAYMENT_SERVICE_MONGO_DB_PORT}/${PAYMENT_SERVICE_MONGO_DB_NAME}?authSource=admin
    user: ${PAYMENT_SERVICE_MONGO_DB_USERNAME}
    password: ${PAYMENT_SERVICE_MONGO_DB_PASSWORD}
    enabled: true

  config:
    import: optional:file:../.env[.properties]
