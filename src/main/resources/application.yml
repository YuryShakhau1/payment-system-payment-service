spring:
  data:
    mongodb:
      host: localhost
      port: ${PAYMENT_SERVICE_MONGO_DB_PORT}
      database: ${PAYMENT_SERVICE_MONGO_DB_NAME}
      username: ${PAYMENT_SERVICE_MONGO_DB_USERNAME}
      password: ${PAYMENT_SERVICE_MONGO_DB_PASSWORD}
      authentication-database: admin

  liquibase:
    change-log: db/changelog/db.changelog-master.yml
    url: mongodb://localhost:${spring.data.mongodb.port}/${spring.data.mongodb.database}}?authSource=admin
    user: ${spring.data.mongodb.username}
    password: ${spring.data.mongodb.password}
    enabled: true

  config:
    import: optional:file:../.env[.properties]

crypto:
  card-secret-key: ${CARD_SECRET_KEY}

app:
  fake-bank-url: ${EXTERNAL_BANK_URL}:${EXTERNAL_BANK_PORT}
