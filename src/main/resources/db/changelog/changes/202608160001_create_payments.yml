databaseChangeLog:
  - changeSet:
      id: 202608160001_create_payments
      author: yury_shakhau
      changes:

        - runCommand:
            command: |
              {
                "create": "payments"
              }

        - runCommand:
            command: |
              {
                "createIndexes": "payments",
                "indexes": [
                  { "key": { "order_id": 1 }, "name": "idx_order_id" },
                  { "key": { "status": 1 }, "name": "idx_status" },
                  { "key": { "created_at": 1 }, "name": "idx_created_at" },
                  { "key": { "user_id": 1, "created_at": 1 }, "name": "idx_user_id_created_at_compound" }
                ]
              }
