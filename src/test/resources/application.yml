server:
  port: ${PAYMENT_SERVICE_PORT:8085}

spring:
  data:
    mongodb:
      host: localhost
      port: ${PAYMENT_SERVICE_MONGO_DB_PORT:27017}
      database: ${PAYMENT_SERVICE_MONGO_DB_NAME:payment_db}
      username: ${PAYMENT_SERVICE_MONGO_DB_USERNAME:db_username}
      password: ${PAYMENT_SERVICE_MONGO_DB_PASSWORD:db_password}
      authentication-database: admin

  liquibase:
    change-log: db/changelog/db.changelog-master.yml
    url: mongodb://localhost:${spring.data.mongodb.port}/${spring.data.mongodb.database}}?authSource=admin
    user: ${spring.data.mongodb.username}
    password: ${spring.data.mongodb.password}
    enabled: true

  config:
    import: optional:file:../.env[.properties]

crypto:
  card-secret-key: ${CARD_SECRET_KEY:fF7vJ3wM3zP6qR8sT1uV4xZ6aB9cD2eF3gH6jK9mN1o}

app:
  fake-bank-url: http://localhost:${EXTERNAL_BANK_PORT:8085}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  endpoints:
    web:
      exposure:
        include: health,info
